<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosy</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/window.css">
  <link rel="stylesheet" href="./css/sidebar.css">
  <link rel="stylesheet" href="./css/batch.css">
  <link rel="stylesheet" href="./css/content.css">
  <link rel="stylesheet" href="./css/calendar.css">
  <link rel="stylesheet" href="./css/detail.css">
  <link rel="stylesheet" href="./css/picker.css">
  <link rel="stylesheet" href="./css/animations.css">
</head>
<body>

<div class="mac-window" id="win">
  <div class="traffic">
    <button class="tl red" id="tlClose" title="关闭窗口"></button>
    <button class="tl yellow" id="tlMin" title="最小化"></button>
    <button class="tl green" id="tlMax" title="最大化/还原"></button>
  </div>

  <!-- 侧栏 -->
  <aside class="sidebar">
    <div class="sidebar-top" data-tauri-drag-region></div>
    <div class="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5L14 14"/></svg>
      <input id="searchInput" placeholder="搜索任务">
    </div>

    <div class="sidebar-flex">
      <div class="mini-cal" id="miniCal"></div>
      <div class="side-label" style="margin:10px 8px 4px">清单进度</div>
      <div id="progList"></div>
      <div class="side-label" style="margin:12px 8px 4px">Coming</div>
      <div id="upList" style="margin-bottom:6px"></div>
    </div>

    <nav class="nav" id="smartNav" style="border-top:.5px solid var(--sep);padding-top:8px;margin-bottom:8px"><!-- 导航项由 js/views.js 注册表生成 --></nav>

    <div class="kbd-hint"><kbd>N</kbd> 新建任务 · <kbd>/</kbd> 搜索</div>

    <div class="sidebar-footer">
      <button class="foot-btn" id="themeBtn">
        <svg id="themeIcon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7z"/></svg>
        <span id="themeLabel">切换深色模式</span>
      </button>
    </div>
  </aside>

  <div class="divider" id="sideDivider" title="拖动调整侧栏宽度"></div>

  <!-- 主内容 -->
  <main class="content">
    <header class="content-header" data-tauri-drag-region>
      <h1 id="viewTitle" data-tauri-drag-region>今天</h1>
      <div class="content-sub" id="viewSub" data-tauri-drag-region></div>
      <button class="hdr-btn" id="obsReimportBtn" title="添加笔记或笔记库（内容变更自动同步）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>添加</button>
      <div class="ring" id="ringBox">
        <svg width="30" height="30" viewBox="0 0 30 30">
          <circle class="track" cx="15" cy="15" r="11.5" fill="none" stroke-width="3.4"/>
          <circle class="bar" id="ringBar" cx="15" cy="15" r="11.5" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="72.25" stroke-dashoffset="72.25"/>
        </svg>
        <div class="ring-label" id="ringLabel"></div>
      </div>
    </header>
    <div class="scroll" id="taskScroll"></div>
    <div class="quickadd" id="quickBar">
      <span class="qa-plus">＋</span>
      <button class="list-pill" id="listPill" style="display:none" title="选择清单">
        <span class="dot" id="listPillDot"></span><span id="listPillName">学习</span>
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>
      </button>
      <input id="quickInput" placeholder="添加任务，回车确认">
      <button class="icon-btn" id="batchBtn" title="批量生成每周固定任务"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 8a5.4 5.4 0 1 1-1.6-3.85"/><path d="M13.6 1.6v2.8h-2.8"/></svg></button>
      <button class="date-pill" id="quickDateBtn" title="选择日期和时间">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.2" width="11" height="10.3" rx="2"/><path d="M2.5 6.4h11M5.2 1.8v2.4M10.8 1.8v2.4"/></svg>
        <span id="quickDateLabel">日期</span>
      </button>
      <span class="qa-kbd">↩</span>
    </div>
    <div id="toast"><span id="toastMsg"></span><button id="toastUndo">撤销</button></div>
  </main>

  <input type="file" id="obsFile" webkitdirectory multiple style="display:none">
  <input type="file" id="obsNoteFile" accept=".md" multiple style="display:none">

  <div class="divider" id="detailDivider" title="拖动调整详情宽度" style="display:none"></div>

  <!-- 详情 -->
  <aside class="detail" id="detailPane">
    <div class="detail-inner" id="detailInner"></div>
  </aside>

  <!-- 日期选择浮层 -->
  <div class="picker hidden" id="picker">
    <div class="pk-head">
      <span class="pk-title" id="pkTitle"></span>
      <div class="pk-navgrp">
        <button class="pk-nav" id="pkPrev"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 2.5L4 6l3.5 3.5"/></svg></button>
        <button class="pk-nav" id="pkNext"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg></button>
      </div>
    </div>
    <div class="pk-grid" id="pkGrid"></div>
    <div class="pk-quick" id="pkQuick">
      <button data-n="0">今天</button><button data-n="1">明天</button><button data-n="wk">周末</button><button data-n="nw">下周</button>
    </div>
    <div class="pk-foot">
      <div class="pk-time"><span>时间</span><input type="time" id="pkTime"><span>可选</span></div>
      <button class="pk-clear" id="pkClear">清除日期</button>
    </div>
  </div>

  <!-- 清单下拉菜单 -->
  <div class="picker menu hidden" id="listMenu"></div>
  <div class="picker menu hidden" id="addSourceMenu" style="width:210px"></div>
  <div class="picker menu hidden" id="obsHiddenMenu" style="width:250px"></div>
  <div class="picker menu hidden" id="vaultMenu" style="width:280px"></div>

  <!-- 批量添加弹窗（每周固定任务） -->
  <div class="modal-back hidden" id="batchModal">
    <div class="batch-card">
      <div class="batch-head">
        <span>每周固定任务 · 批量生成</span>
        <button class="icon-btn" id="batchClose" title="关闭"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>
      </div>
      <div class="batch-body">
        <div class="f-row">
          <span class="f-label">任务</span>
          <input class="f-title" id="repTitle" placeholder="例如：背 50 个单词 / 组会 / 晨跑">
        </div>
        <div class="f-row">
          <span class="f-label">每周</span>
          <div class="wd-chips" id="wdChips">
            <button class="wd-chip on" data-wd="1">一</button>
            <button class="wd-chip" data-wd="2">二</button>
            <button class="wd-chip on" data-wd="3">三</button>
            <button class="wd-chip" data-wd="4">四</button>
            <button class="wd-chip on" data-wd="5">五</button>
            <button class="wd-chip" data-wd="6">六</button>
            <button class="wd-chip" data-wd="7">日</button>
          </div>
        </div>
        <div class="f-row">
          <span class="f-label">时间</span>
          <input class="f-input" type="time" id="repTime">
          <span class="f-note">可选</span>
          <span class="mini-seg" id="repSeg" style="margin-left:auto">
            <button data-l="study"><span class="dot" style="background:#9d6bce"></span>学习</button>
            <button data-l="life"><span class="dot" style="background:#ff9372"></span>生活</button>
          </span>
        </div>
        <div class="f-row">
          <span class="f-label">范围</span>
          <span class="f-note">从今天起</span>
          <input class="f-input" type="number" id="repWeeks" min="1" max="26" value="4" style="width:60px">
          <span class="f-note">周内重复</span>
        </div>
        <div class="batch-preview" id="repPreview">填写任务名并选择星期，这里会预览生成的日期</div>
      </div>
      <div class="batch-foot">
        <span class="cnt" id="repCount">0 个任务</span>
        <button class="btn btn-ghost" id="batchCancel">取消</button>
        <button class="btn btn-primary" id="repAdd" disabled>生成任务</button>
      </div>
    </div>
  </div>
</div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
